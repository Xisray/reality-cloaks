# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Compile All Cloak Sites

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Process and Build Sites
      run: |
        shopt -s nullglob

        # 1. Создаем временную папку для финального результата
        mkdir -p output

        # Собираем все подходящие папки в массив
        dirs=([0-9]*/)

        # Проверяем, нашли ли мы вообще папки с заглушками
        if [ ${#dirs[@]} -eq 0 ]; then
          echo "⚠️ Warning: No directories matching [0-9]*/ found!"
          echo "Make sure you have pushed folders like '001-xxx' with files inside."
        fi

        # 2. Цикл по массиву папок
        for dir in "${dirs[@]}"; do
          dir=${dir%/}
          echo "----------------------------------------"
          echo "Processing directory: $dir"
          echo "----------------------------------------"

          mkdir -p "output/$dir"

          if [ -f "$dir/package.json" ]; then
            echo "$dir has package.json. Starting Node.js build..."
            cd "$dir"
            npm ci
            npm run build
            cd ..

            if [ -d "$dir/dist" ]; then
              cp -r "$dir/dist/." "output/$dir/"
            elif [ -d "$dir/build" ]; then
              cp -r "$dir/build/." "output/$dir/"
            else
              echo "❌ Error: Build folder (dist or build) not found for $dir"
              exit 1
            fi
          else
            echo "$dir is a static HTML site. Copying files directly..."
            # Защита: копируем файлы, только если папка не пустая
            if [ "$(ls -A "$dir")" ]; then
              cp -r "$dir"/. "output/$dir/"
            fi
          fi
        done
    - name: Deploy to Build Branch
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: output
        branch: build
        clean: true
